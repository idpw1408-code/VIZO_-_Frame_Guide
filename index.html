<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIZO : Frame Guide</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
    <div class="container">
        <h1 class="main-title">VIZO : Frame Guide</h1>
        
        <label class="title">종횡비 선택</label>
        <select id="ratioSelect" onchange="onComboSelect()">
            <option value="Custom">Custom (사용자 정의)</option>
            <option value="1.7777777777777777" selected>16:9 (유튜브/일반 영상)</option>
            <option value="2.1666666666666665">19.5:9 (스마트폰)</option>
            <option value="1">1:1 (SNS 정사각형)</option>
            <option value="1.3333333333333333">4:3 (고전 TV/사진)</option>
            <option value="1.33">1.33 (디지털 시네마 표준)</option>
            <option value="1.66">1.66 (유럽식 와이드스크린)</option>
            <option value="1.77">1.77 (HDTV)</option>
            <option value="1.85">1.85 (극장용 와이드스크린)</option>
            <option value="2.35">2.35 (시네마스코프)</option>
            <option value="2.39">2.39 (아나모픽 와이드스크린)</option>
            <option value="2.40">2.40 (최신 시네마 규격)</option>
        </select>

        <div class="input-row">
            <div class="input-field">
                <label>가로(Width)</label>
                <div class="input-wrapper">
                    <input type="number" id="ent_w" placeholder="Width" onkeyup="calculate('h')">
                    <span class="unit">px</span>
                </div>
                <button class="copy-btn" onclick="copyValue('ent_w')">Copy</button>
            </div>
            
            <button id="lockBtn" onclick="toggle()">🔗</button>
            
            <div class="input-field">
                <label>세로(Height)</label>
                <div class="input-wrapper">
                    <input type="number" id="ent_h" placeholder="Height" onkeyup="calculate('w')">
                    <span class="unit">px</span>
                </div>
                <button class="copy-btn" onclick="copyValue('ent_h')">Copy</button>
            </div>
        </div>
        
        <p class="footer">수치를 입력하면 즉시 자동 계산됩니다</p>

        <div class="info-panel">
            <h3>해상도 가이드</h3>
            <ul>
                <li><strong>SD:</strong> 854 x 480 - 과거 낮은 화질</li>
                <li><strong>HD:</strong> 1280 x 720 - HD급 화질</li>
                <li><strong>FHD:</strong> 1920 x 1080 - 가장 대중적인 규격</li>
                <li><strong>QHD:</strong> 2560 x 1440 - FHD 2배 화질</li>
                <li><strong>UHD(4K):</strong> 3840 x 2160 - 고화질 표준</li>
                <li><strong>8K UHD:</strong> 7680 x 4320 - 초고화질</li>
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
